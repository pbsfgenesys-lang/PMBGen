name: Deploy GitHub Pages

on:
  push:
    branches: [main, strict-sf, brand-rollup]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble multi-view site
        run: |
          set -euo pipefail
          mkdir -p _site/strict-sf _site/brand-rollup
          git archive origin/strict-sf | tar -x -C _site/strict-sf
          git archive origin/brand-rollup | tar -x -C _site/brand-rollup
          git archive origin/main | tar -x -C _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
